services:
  app:
    image: ${APP_IMAGE:-ghcr.io/joaovitorps/snippet-vault:main}
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  migrate:
    image: ${APP_IMAGE:-ghcr.io/joaovitorps/snippet-vault:main}
    command: ["node", "packages/api/dist/db/migrate.js"]
    env_file:
      - .env
    restart: "no"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
